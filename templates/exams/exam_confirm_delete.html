{% extends "base.html" %}
{% block title %}Supprimer l'examen — Pharmexam{% endblock %}

{% block content %}
  <div class="form-page">
    <div class="form-page__header">
      <div>
        <h1 class="page-title">Supprimer l'examen</h1>
        <p class="page-subtitle">Cette action est irréversible.</p>
      </div>
      <a class="btn btn--outline" href="{% url 'exams:exam_list' %}">Retour</a>
    </div>

    <div class="card form-card">
      <div class="confirm-copy">
        <p>Confirmer la suppression de l'examen <strong>{{ object.nom }}</strong> ?</p>
      </div>

      <form method="post" class="form-actions">
      {% csrf_token %}
        <button class="btn btn--ghost" type="submit">Supprimer</button>
        <a class="btn btn--outline" href="{% url 'exams:exam_list' %}">Annuler</a>
      </form>
    </div>
  </div>
{% endblock %}
