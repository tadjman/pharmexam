<nav class="nav">
  {% if user.is_authenticated %}
    <div class="nav__group">
      <a class="nav__item" href="{% url 'dashboard' %}">Tableau de bord</a>
      <a class="nav__item" href="{% url 'academics:annee_list' %}">Années universitaires</a>
      <a class="nav__item" href="{% url 'academics:formation_list' %}">Formations</a>
      <a class="nav__item" href="{% url 'exams:exam_list' %}">Examens</a>
      <a class="nav__item" href="{% url 'reports:activity_report' %}">Suivi</a>
      {% if user.is_staff or user.is_superuser %}
        <a class="nav__item" href="/admin/">Admin</a>
      {% endif %}
    </div>

    <form class="nav__form nav__form--end" method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="nav__logout-btn">Déconnexion</button>
    </form>
  {% else %}
    <a class="nav__item" href="{% url 'login' %}">Connexion</a>
  {% endif %}
</nav>
